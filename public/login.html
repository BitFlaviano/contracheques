<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"  href="https://kidverte.vteximg.com.br/arquivos/kidvert-favicon.ico?v=636445463116770000">
    <title>Kidverte Contracheque- Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="/supabase.js"></script>
    
</head>
<body>

    <div class="card">
         <img
        src="https://kidverte.vteximg.com.br/arquivos/logo-new.png?v=636661474853570000"
        alt="Kidverte"
        class="logo-login"
    >

        <h2>Acessar Portal</h2>

        <input type="text" id="email" placeholder="E-mail ou CPF">
        <input type="password" id="password" placeholder="Senha">
        <!-- <button id="btn-login" type="button">Entrar</button> -->
        <button type="button" onclick="fazerLogin()">Entrar</button>
        <p id="mensagem-erro" style="color:red;"></p>
        <p class="forgot-password">
        <a href="#" onclick="abrirRecuperacaoSenha()">
            Esqueci a senha
        </a>
</p>
    </div>

    <div id="modal-recuperacao" class="modal-login" style="display:none;">
        <div class="modal-login-content">
            <h3>Recuperar senha</h3>
            <p>Informe o e-mail cadastrado. Verifique também a caixa de spam.</p>
            <input type="email" id="email-recuperacao" placeholder="E-mail cadastrado">
            <p id="msg-recuperacao"></p>
            <button type="button" onclick="enviarRecuperacaoSenha()">Enviar link</button>
            <button type="button" onclick="fecharRecuperacaoSenha()">Fechar</button>
        </div>
    </div>

    <footer class="site-footer">&copy; Flaviano Porto 2026</footer>
    
    
    <script defer src="script.js"></script>
</body>
</html>
