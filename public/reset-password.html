<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"  href="https://kidverte.vteximg.com.br/arquivos/kidvert-favicon.ico?v=636445463116770000">
    <title>Redefinir Senha</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="card">

        <h2>Nova Senha</h2>

        <input
            type="password"
            id="nova-senha"
            placeholder="Digite a nova senha"
        >
        <input
            type="password"
            id="confirmar-senha"
            placeholder="Confirme a nova senha"
        >

        <button onclick="alterarSenha()">
            Alterar Senha
        </button>

        <p id="msg"></p>

    </div>
    <script defer src="script.js"></script>
    <footer class="site-footer">&copy; Flaviano Porto 2026</footer>
</body>

</html>
