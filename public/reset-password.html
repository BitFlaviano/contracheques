<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="card">

        <h2>Nova Senha</h2>

        <input
            type="password"
            id="nova-senha"
            placeholder="Digite a nova senha"
        >

        <button onclick="alterarSenha()">
            Alterar Senha
        </button>

        <p id="msg"></p>

    </div>

    <script>

        const SUPABASE_URL =
            'https://uatryxvylqwslnaxggjk.supabase.co';

        const SUPABASE_KEY =
            'SUA_CHAVE_ANON';

        const client =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        async function alterarSenha() {

            const senha =
                document.getElementById(
                    "nova-senha"
                ).value;

            const msg =
                document.getElementById(
                    "msg"
                );

            if (senha.length < 6) {

                msg.innerText =
                    "Senha muito curta.";

                msg.style.color =
                    "red";

                return;
            }

            const {
                error
            } = await client.auth.updateUser({
                password: senha
            });

            if (error) {

                msg.innerText =
                    error.message;

                msg.style.color =
                    "red";

                return;
            }

            msg.innerText =
                "Senha alterada com sucesso!";

            msg.style.color =
                "green";

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 2000);
        }

    </script>
    <footer class="site-footer">&copy; Flaviano Porto 2026</footer>
</body>

</html>
