<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="styleadmin.css">
    
    
</head>
<body style="display:none;">
    
    <!-- HEADER -->
    <div class="header">
        <h1>Painel Administrativo</h1>
        <button onclick="fazerLogout()">Sair</button>
    </div>

    <!-- MENU -->
    <div class="menu">
        <button onclick="irCadastro()">Cadastrar Usuário</button>
        <button onclick="irUpload()">Enviar Contracheques</button>
    </div>

    <div class="container">
        <div class="card">
            <h3>Bem-vindo, <span id="nome-usuario"></span>!</h3>
            <!-- <div class="container"> -->
                    
                    <h3>Meus Contracheques </h3>
                    <!-- <button id="btn-refresh" class="btn-refresh" onclick="recarregarContracheques()">
                    ⟳
                    </button> -->
                    <div id="loading-user" style="display:none;">
                        <div class="dots"></div>
                            <!-- <p>Buscando contracheques...</p> -->
                        </div>

                    <!-- <div id="lista-arquivos-admin"></div> -->
                    <div id="lista-arquivos"></div>
                
            <!-- </div> -->
        </div>
        
    </div>

    <!-- LISTA DE USUÁRIOS -->
     
    <!-- CONTEÚDO -->
    <div class="container">
        <div class="card">
            <h3>Usuários do Sistema</h3>
            <!-- <div id="lista-usuarios" class="loading"><div class="dots"></div></div> -->
             <div id="loading-usuarios" style="display:none;">
            <div class="dots"></div>
            </div>

            <div id="lista-usuarios"></div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h3>Confirmações de Recebimento</h3>
            <div id="loading-confirmacoes" style="display:none;">
                <div class="dots"></div>
            </div>

            <div id="lista-confirmacoes"></div>
        </div>
    </div>

    <!-- MODAL ALTERAR SENHA -->
    <div id="modal-senha" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div class="modal-content" style="background:white; padding:30px; border-radius:10px; width:350px;">
            <h3>Alterar Senha</h3>
            <input type="password" id="nova-senha" placeholder="Nova senha" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="password" id="confirmar-senha" placeholder="Confirmar senha" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <button onclick="confirmarAlteracaoSenha()">Salvar</button>
                <button onclick="fecharModalSenha()" style="background:#6c757d;">Cancelar</button>
            </div>
            <p id="msg-senha" style="margin-top:10px;"></p>
        </div>
    </div>

    <div id="modal-editar" style="display:none;" class="modal">
        <div class="modal-content">
            <h3>Alterar Cadastro</h3>

            <input type="email" id="edit-email" placeholder="Novo email">
            <input type="password" id="edit-senha" placeholder="Nova senha (opcional)">

            <p id="msg-editar"></p>

            <button onclick="confirmarAlteracaoCadastro()">Salvar</button>
            <button onclick="fecharModalEditar()">Cancelar</button>
        </div>
    </div>

    <div id="modal-termos" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Confirmação</h3>

            <p>
                Declaro que ao clicar no botão download
                confirmo o recebimento do documento.
            </p>

            <label class="check-termo">
                <input type="checkbox" id="aceite-termos">
                Li e concordo.
            </label>

            <button id="btn-confirmar-download">
                Confirmar Download
            </button>

            <button type="button" onclick="fecharModalTermos()">
                Fechar
            </button>
        </div>
    </div>

    <footer class="site-footer">Copyright Flaviano Porto 2026</footer>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
