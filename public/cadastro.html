<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"  href="https://kidverte.vteximg.com.br/arquivos/kidvert-favicon.ico?v=636445463116770000">
  <title>Cadastro de Funcionário</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body style="display:none;">

<div class="box">
  <h2>Cadastro</h2>

  <input type="text" id="nome" placeholder="Nome" oninput="this.value = this.value.toUpperCase()">
  <input type="email" id="email" placeholder="Email" oninput="this.value = this.value.toLowerCase()">
  <input type="password" id="senha" placeholder="Senha">
  <input type="text" id="cpf" placeholder="CPF (Apenas números)" inputmode="numeric" oninput="this.value = this.value.replace(/\\D/g, '')">

  <select id="tipo">
    <option value="funcionario">Funcionário</option>
    <option value="admin">Administrador</option>
  </select>
  <button onclick="cadastrar()">Cadastrar</button>

  <p id="msg"></p>
</div>

<footer class="site-footer">&copy; Flaviano Porto 2026</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script defer src="script.js"></script>
</body>
</html>
